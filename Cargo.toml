[package]
name = "tree-sitter-kotlin-codanna"
description = "Kotlin grammar for the tree-sitter parsing library (includes unreleased fixes from upstream)"
version = "0.4.0"
keywords = ["incremental", "parsing", "kotlin"]
categories = ["parser-implementations", "text-editors"]
repository = "https://github.com/bartolli/tree-sitter-kotlin"
edition = "2021"
license = "MIT"
readme = "bindings/rust/README.md"

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.24"
